<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prototipo POS · Marcar entrada y mapa de mesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141218; --surf:#1d1b20; --surf-hi:#2b2930; --surf-top:#36343b;
  --on:#e6e0e9; --on-var:#cac4d0; --outline:#938f99; --outline-var:#49454f;
  --pri:#d0bcff; --on-pri:#381e72; --pri-cont:#4f378b; --on-pri-cont:#eaddff;
  --sec-cont:#4a4458; --err-cont:#8c1d18; --on-err-cont:#ffdad6; --err:#f2b8b5;
  --s:1; --w:962;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
body{background:#0c0b0f;color:var(--on);font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:0;gap:0;justify-content:center;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input{font:inherit;color:inherit}

/* ---- shell de la página ---- */
.meta{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:#a9a3b3}
.meta b{color:#e6e0e9;font-weight:500}
.meta .jump{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid #3a363f;border-radius:14px;font-size:12px;color:#cac4d0}
.chip:hover{background:#1d1b20}
#fit{width:calc(var(--w)*1px*var(--s));height:calc(601px*var(--s));flex:none}
#stage{width:calc(var(--w)*1px);height:601px;transform:scale(var(--s));transform-origin:0 0;position:relative;overflow:hidden;background:var(--bg);font-size:14px}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0c0b0f;color:var(--on-var);align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:16px;text-align:center;padding:24px}
#rot svg{width:56px;height:56px;fill:var(--pri)}
@media (orientation:portrait){#rot{display:flex}}
.hint{max-width:962px;font-size:12.5px;line-height:1.55;color:#a9a3b3;text-align:center}
.hint code{background:#1d1b20;border:1px solid #2e2b33;border-radius:5px;padding:1px 6px;color:#e6e0e9;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---- primitivas ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{height:65px;flex:none;border-bottom:1px solid var(--outline-var);display:flex;align-items:center;gap:12px;padding:0 16px}
.topbar .title{font-size:22px;line-height:28px}
.topbar .sub{font-size:14px;color:var(--on-var);letter-spacing:.2px}
.grow{flex:1}
.logo{width:40px;height:40px;border-radius:8px;background:var(--surf-hi);display:grid;place-items:center;font-size:10px;letter-spacing:.6px;color:var(--on-var)}
.clock{text-align:right}
.clock b{display:block;font-weight:400;font-size:18px;line-height:24px}
.clock span{font-size:12px;color:var(--on-var);line-height:16px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-var)}
.iconbtn.out{width:40px;height:40px;border:1px solid var(--outline-var);color:var(--on)}
.iconbtn:hover{background:rgba(230,224,233,.08)}
.pill{height:48px;border-radius:24px;padding:0 20px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;letter-spacing:.1px;white-space:nowrap}
.pill.filled{background:var(--pri);color:var(--on-pri)}
.pill.filled:hover{filter:brightness(1.06)}
.pill.filled:disabled{background:rgba(230,224,233,.12);color:rgba(230,224,233,.38);filter:none}
.pill.tonal{background:var(--sec-cont);color:var(--on)}
.pill.out{border:1px solid var(--outline);color:var(--on);background:transparent}
.pill.out:hover{background:rgba(230,224,233,.06)}
.pill.txt{color:var(--pri);padding:0 12px}
.pill.sm{height:40px;padding:0 16px}
.tb{color:var(--pri);font-weight:500;font-size:14px;padding:10px 12px;border-radius:20px;letter-spacing:.1px}
.tb:hover{background:rgba(208,188,255,.08)}
.tb:disabled{color:rgba(230,224,233,.38);background:none}

/* ---- inicio ---- */
.home-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:36px}
.home-body h1{font-weight:400;font-size:28px;line-height:36px}
.home-body p{margin-top:12px;font-size:14px;color:var(--on-var)}
.cards{display:flex;gap:16px;margin-top:28px}
.card{width:260px;height:168px;border-radius:28px;border:1px solid var(--outline-var);background:var(--surf);padding:20px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .12s,filter .12s}
.card:hover{filter:brightness(1.12)}
.card:active{transform:scale(.98)}
.card.pri{background:var(--pri-cont);border-color:var(--pri-cont);color:var(--on-pri-cont)}
.card b{display:block;font-weight:400;font-size:24px;line-height:32px}
.card span{display:block;font-size:14px;line-height:20px;color:var(--on-var);margin-top:4px}
.card.pri span{color:var(--on-pri-cont)}

/* ---- código ---- */
.code-body{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;padding-bottom:20px}
.form{width:380px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px;margin-bottom:-4px}
.seg{display:flex;height:40px;width:310px;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{flex:1;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;border-right:1px solid var(--outline)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sec-cont)}
.seg button:disabled{color:rgba(230,224,233,.38)}
.field{position:relative;height:56px;border:1px solid var(--outline);border-radius:4px;display:flex;align-items:center;padding:0 16px}
.field .fl{position:absolute;top:-9px;left:12px;padding:0 4px;background:var(--bg);font-size:12px;color:var(--on-var)}
.field .val{font-size:16px;letter-spacing:.5px;color:var(--on)}
.field .val.ph{color:var(--on-var)}
.field .val.dots{letter-spacing:10px;font-size:20px}
.field.err{border-color:var(--err);border-width:2px}
.field.err .fl{color:var(--err)}
.field.dis{border-color:var(--outline-var);color:rgba(230,224,233,.38)}
.field.dis .val{color:rgba(230,224,233,.38)}
.field.dis .fl{color:rgba(230,224,233,.38)}
.support{font-size:12px;color:var(--err);padding:0 16px;margin-top:-10px}
.info{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--on-var)}
.info svg{color:var(--pri);flex:none}
.banner{display:flex;align-items:center;gap:12px;background:var(--err-cont);color:var(--on-err-cont);border-radius:12px;padding:14px 16px;font-size:14px;line-height:20px}
.banner.warn{background:var(--surf);color:var(--on-var)}
.big{height:56px;border-radius:28px;font-size:16px;width:100%;justify-content:center}
.link{color:var(--pri);font-weight:500;font-size:14px;align-self:flex-start;padding:8px 16px}
.keypad{display:grid;grid-template-columns:repeat(3,100px);gap:10px}
.keypad button{height:56px;border-radius:16px;background:var(--sec-cont);font-size:18px;display:grid;place-items:center}
.keypad button:hover{filter:brightness(1.15)}
.keypad button:active{transform:scale(.96)}
.keypad button.t{background:none;color:var(--pri);font-size:14px;font-weight:500}
.keypad button:disabled{background:var(--surf-hi);color:rgba(230,224,233,.28);filter:none;transform:none}
.keypad button.t:disabled{background:none;color:rgba(208,188,255,.3)}

/* ---- éxito ---- */
.ok-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px;text-align:center}
.okc{width:64px;height:64px;border-radius:50%;background:var(--pri-cont);display:grid;place-items:center;color:var(--on-pri-cont)}
.ok-body h2{font-weight:400;font-size:28px;line-height:36px;margin-top:16px}
.ok-body .l{font-size:16px;margin-top:10px;color:var(--on-var)}
.sum{display:flex;justify-content:space-between;gap:120px;background:var(--surf);border-radius:16px;padding:16px 24px;margin-top:20px;text-align:left;min-width:426px}
.sum small{display:block;font-size:12px;color:var(--on-var)}
.sum b{display:block;font-weight:400;font-size:16px;margin-top:6px}
.ok-actions{display:flex;gap:12px;margin-top:18px}
.cd{margin-top:14px;font-size:12px;color:var(--on-var)}

/* ---- mapa ---- */
.mbody{flex:1;display:flex;gap:12px;padding:16px;min-height:0}
.panel{background:var(--surf);border-radius:28px;display:flex;flex-direction:column;min-height:0}
.left{width:656px;padding:16px;overflow:hidden}
.right{width:260px;padding:16px}
.search{position:relative;height:56px;border:1px solid var(--outline);border-radius:4px;display:flex;align-items:center;gap:14px;padding:0 16px;margin-bottom:12px}
.search .fl{position:absolute;top:-9px;left:12px;padding:0 4px;background:var(--surf);font-size:12px;color:var(--on-var)}
.search input{background:none;border:0;outline:0;font-size:16px;flex:1;min-width:0}
.search input::placeholder{color:var(--on-var)}
.search svg{color:var(--on-var);flex:none}
.grid{display:grid;grid-template-columns:repeat(10,54px);gap:8px;align-content:start}
.tbl{position:relative;width:54px;height:54px;border-radius:14px;border:1px solid var(--outline);font-size:16px;display:grid;place-items:center;transition:transform .1s}
.tbl:not(:disabled):hover{filter:brightness(1.2)}
.tbl:not(:disabled):active{transform:scale(.95)}
.tbl:disabled{cursor:default}
.t-res{background:var(--sec-cont);border-color:var(--sec-cont)}
.t-occ{background:var(--on);color:#322f35;border-color:var(--on)}
.t-oo{background:#79757f;border-color:#79757f;color:#2f2b34}
.t-or{background:var(--sec-cont);border-color:var(--sec-cont);color:var(--on)}
.t-faint{border-color:#322f37;color:#4a4650;background:transparent}
.t-faint.t-oo{background:#6c6872;border-color:#6c6872;color:#46424b}
.t-faint.t-or{background:#2a2733;border-color:#2a2733;color:#5a5560}
.t-mine{border-color:#f1ecf6;color:#fff}
.t-mine.t-res{background:var(--sec-cont);border-color:var(--sec-cont)}
.t-mine.t-occ{background:var(--on);border-color:var(--on);color:#322f35}
.t-sel{border:2px solid var(--pri)!important;box-shadow:0 0 0 0 transparent}
.t-cur{border:2px solid var(--pri)!important}
.badge{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;border:2px solid var(--surf)}
.badge.join{background:var(--pri-cont);color:var(--on-pri-cont)}
.t-join{border:2px solid var(--pri-cont)!important}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ph h3{font-weight:400;font-size:22px;line-height:28px}
.ph small{display:block;font-size:12px;color:var(--on-var);line-height:16px;margin-top:2px}
.help{font-size:12px;line-height:16px;color:var(--on-var);margin-top:12px;letter-spacing:.2px}
.rlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;overflow:auto}
.ritem{display:flex;align-items:center;justify-content:space-between;background:var(--surf-hi);border-radius:12px;padding:0 4px 0 16px;min-height:56px}
.ritem b{display:block;font-weight:400;font-size:16px;line-height:24px}
.ritem small{display:block;font-size:14px;color:var(--on-var);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.ritem .iconbtn{width:48px;height:48px}
.rsv{background:var(--surf-hi);border-radius:12px;padding:12px 16px;margin-top:12px}
.rsv .t{display:flex;justify-content:space-between;font-size:12px;color:var(--on-var);margin-bottom:2px}
.rsv .t b{font-weight:400;color:var(--on)}
.rsv .n{font-size:16px;line-height:24px}
.rsv .d{font-size:14px;color:var(--on-var)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{height:84px;border-radius:16px;background:var(--sec-cont);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px}
.opt.wide{grid-column:1/3}
.opt:hover:not(:disabled){filter:brightness(1.15)}
.opt:disabled{opacity:.4}
.chk{display:flex;align-items:center;gap:12px;height:48px;margin-top:8px;font-size:16px}
.cb{width:18px;height:18px;border:2px solid var(--on-var);border-radius:2px;display:grid;place-items:center;flex:none}
.cb.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.cb svg{width:14px;height:14px}

/* ---- overlays ---- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.52);display:grid;place-items:center;z-index:20;animation:fade .15s}
.dlg{background:var(--surf-hi);border-radius:28px;padding:24px 0 0;min-width:312px;max-width:420px;box-shadow:0 8px 28px rgba(0,0,0,.4);animation:pop .16s}
.dlg .in{padding:0 24px}
.dlg h4{font-weight:400;font-size:24px;line-height:32px}
.dlg p{font-size:14px;line-height:20px;color:var(--on-var);margin-top:16px;letter-spacing:.2px}
.dlg.c{text-align:center}
.dlg.c .ic{display:grid;place-items:center;color:var(--pri);margin-bottom:16px}
.dlg.c p{margin-top:12px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;padding:24px}
.dlg .field{background:transparent}
.dlg .field .fl{background:var(--surf-hi)}
.dlg .field input{background:none;border:0;outline:0;font-size:16px;width:100%}
.dlg .field:focus-within{border:2px solid var(--pri);padding:0 15px}
.dlg .field:focus-within .fl{color:var(--pri)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;height:64px;padding:0 16px;margin-top:16px;font-size:16px}
.step .c{display:flex;align-items:center;gap:16px}
.step .c b{font-weight:400;min-width:20px;text-align:center}
.sb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--outline)}
.sb.f{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.sb:disabled{opacity:.38}
.rad{display:flex;align-items:center;gap:8px;padding:0 12px;height:56px;border-radius:12px;width:100%;text-align:left}
.rad:hover{background:rgba(230,224,233,.06)}
.rad i{width:48px;height:48px;display:grid;place-items:center;flex:none}
.rad i s{width:20px;height:20px;border:2px solid var(--on-var);border-radius:50%;display:grid;place-items:center}
.rad.on i s{border-color:var(--pri)}
.rad.on i s:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.rad b{display:block;font-weight:400;font-size:16px;line-height:24px}
.rad small{font-size:12px;color:var(--on-var)}
.snack{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);min-width:344px;max-width:520px;min-height:48px;background:#e6e0e9;color:#322f35;border-radius:4px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;font-size:14px;z-index:30;box-shadow:0 3px 10px rgba(0,0,0,.4);animation:up .2s}
.snack button{color:#6750a4;font-weight:500;font-size:14px;padding:8px 0 8px 8px}
.na,.na .dlg,.snack.na{animation:none!important}
.snack.err{background:#f9dedc;color:#410e0b}
.snack.err button{color:#8c1d18}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- toma de pedido ---- */
.bk{width:52px;height:48px;border:1px solid var(--outline-var);border-radius:12px;display:grid;place-items:center;flex:none}
.bk:hover{background:rgba(230,224,233,.08)}
.opb{height:48px;padding:0 20px;border:1px solid var(--outline-var);border-radius:12px;font-weight:500;font-size:14px}
.opb:hover{background:rgba(230,224,233,.08)}
.ttl b{display:block;font-weight:400;font-size:22px;line-height:28px}
.ttl small{display:block;font-size:12px;color:var(--on-var);line-height:16px}
.ord{flex:1;display:flex;gap:12px;padding:0 16px 16px;min-height:0}
.cat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;padding-top:0}
.seatcard{background:var(--surf);border-radius:16px;padding:10px 12px 12px;margin:0 0 8px;flex:none}
.seatcard .sh{font-size:11px;color:var(--on-var);display:flex;gap:12px;align-items:center;margin-bottom:8px;letter-spacing:.3px}
.seats{display:flex;flex-wrap:wrap;gap:6px}
.seat{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--outline-var);border-radius:12px;font-size:14px;display:grid;place-items:center;white-space:nowrap}
.seat:hover{background:rgba(230,224,233,.07)}
.seat.on{background:#d4c9ea;color:#2a2238;border-color:#d4c9ea;border-radius:20px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;flex:none}
.cats::-webkit-scrollbar{display:none}
.cch{height:32px;padding:0 14px;border:1px solid var(--outline);border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex:none}
.cch.on{background:var(--sec-cont);border-color:var(--sec-cont)}
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;align-content:start;overflow:auto;flex:1;min-height:0;padding-bottom:4px;scrollbar-width:thin}
.prod{position:relative;width:auto;height:84px;flex:none;border:1px solid var(--outline-var);border-radius:12px;background:var(--surf);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;line-height:16px;font-weight:500;transition:transform .1s}
.prod .pn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:14px}
.prod:hover{filter:brightness(1.15)}
.prod:active{transform:scale(.97)}
.prod.has{border:1.5px solid var(--pri)}
.cnt{position:absolute;top:8px;right:8px;min-width:18px;height:18px;border-radius:9px;background:#f9b8b4;color:#601410;font-size:11px;font-weight:500;display:grid;place-items:center;padding:0 5px}
.tk{width:280px;flex:none;background:var(--surf);border-radius:16px;padding:12px;display:flex;flex-direction:column;min-height:0}
.tk .th{display:flex;justify-content:space-between;align-items:center;padding:0 0 8px;font-size:16px;font-weight:500}
.tk .th span{font-size:12px;color:var(--on-var);font-weight:400}
.tlist{flex:1;overflow:auto;min-height:0}
.tl{display:flex;justify-content:space-between;padding:7px 12px;font-size:14px;color:var(--on-var);border-radius:12px;text-align:left;width:100%}
.tl:hover{background:rgba(230,224,233,.06)}
.tact{background:var(--sec-cont);border-radius:16px;padding:2px 0 10px;margin:2px 0}
.tact .hd{display:flex;justify-content:space-between;padding:8px 12px;font-weight:500;font-size:14px}
.tact .li{display:flex;justify-content:space-between;padding:6px 12px;font-size:14px;font-weight:500;width:100%;text-align:left}
.tact .mod{padding:0 12px 0 24px;font-size:12px;color:var(--on-var);line-height:22px}
.tact .mod.neg{color:#f2b8b5}
.tact .empty{padding:2px 12px 4px;font-size:12px;color:var(--on-var);line-height:16px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 8px;font-size:12px;color:var(--on-var)}
.tot b{font-weight:400;font-size:24px;color:var(--on)}
.tk .tacts{display:flex;gap:8px}

function tblClass(id,ctx){
 const t=S.tables[id], c=['tbl'];
 const mine=t.owner==='me', other=t.owner==='other';
 if(other)c.push(t.status==='occ'?'t-oo':'t-or');
 else if(t.status==='occ')c.push('t-occ');
 else if(t.status==='res')c.push('t-res');
 if(mine)c.push('t-mine');
 let dis=false;
 if(ctx==='pick'){ if(other)dis=true; if(S.pick.has(id))c.push('t-sel'); }
 if(ctx==='mine'){ if(!mine)c.push('t-faint'); if(S.sel===id)c.push('t-cur'); if(t.join)c.push('t-join'); if(!mine)dis=true; }
 if(ctx==='all'){ if(S.sel===id)c.push('t-cur'); if(t.join)c.push('t-join'); }
 if(ctx==='dar'){ if(!mine){c.push('t-faint');dis=true} if(S.giveSel.has(id))c.push('t-sel'); }
 if(ctx==='unir'){ if(t.status==='occ'){c.push('t-faint');dis=true} if(S.joinSel.has(id))c.push('t-sel'); }
 return {cls:c.join(' '),dis};
}

  const jn=S.tables[id].join&&(ctx==='mine'||ctx==='all');

}

  <div class="acts" style="justify-content:flex-end"><button class="tb" data-act="dlg-early-back">Volver</button><button class="tb" data-act="dlg-early-ok">Autorizar y marcar</button></div></div>`;
 if(d.t==='confirmPick'){const ids=[...S.pick].sort((a,b)=>a-b);b=`<div class="dlg" style="width:312px"><div class="in"><h4>¿Empezar turno con ${ids.length} ${ids.length===1?'mesa':'mesas'}?</h4><p>Mesas ${list(ids)}.<br>Turno ${S.emp.shift}.</p></div><div class="acts"><button class="tb" data-act="confirm-review">Revisar</button><button class="tb" data-act="confirm-go">Empezar turno</button></div></div>`}
 if(d.t==='crear')b=`<div class="dlg" style="width:400px"><div class="in"><h4>Crear mesa</h4><p style="margin-top:12px">La mesa se agregará a Mis mesas.</p>
  <div class="field" style="margin-top:20px;border:1px solid var(--outline)"><span class="fl">Nombre de la mesa</span><input id="nm" placeholder="Opcional" maxlength="28" autocomplete="off" value="${d.name.replace(/"/g,'&quot;')}"></div>${stepper(d.pers)}</div>
  <div class="acts"><button class="tb" data-act="crear-cancel">Cancelar</button><button class="tb" data-act="crear-ok" ${d.pers>=1?'':'disabled'}>Crear mesa</button></div></div>`;
 if(d.t==='dar')b=`<div class="dlg" style="width:312px"><div class="in"><h4>Dar mesas</h4><p style="margin-top:12px">Elige al compañero que recibirá ${S.giveSel.size===1?'la mesa':'las '+S.giveSel.size+' mesas'}.</p></div>
  <div style="padding:8px 12px 0">${COLLEAGUES.filter(c=>c.n!==S.emp.full).map(c=>`<button class="rad ${d.to===c.n?'on':''}" data-act="dar-pick" data-n="${c.n}"><i><s></s></i><span><b>${c.n}</b><small>En turno · ${c.c} mesas</small></span></button>`).join('')}</div>
  <div class="acts"><button class="tb" data-act="dar-back">Cancelar</button><button class="tb" data-act="dar-ok" ${d.to?'':'disabled'}>Dar mesas</button></div></div>`;
 if(d.t==='unir'){const n=S.joinSel.size;b=`<div class="dlg" style="width:400px"><div class="in"><h4>Unir ${n} mesas</h4><p style="margin-top:12px">Indica cuántos comensales se sentarán en la unión (${n*4} sillas).</p>${stepper(d.pers)}</div>
  <div class="acts"><button class="tb" data-act="unir-back">Cancelar</button><button class="tb" data-act="unir-ok" ${d.pers>=1?'':'disabled'}>Unir mesas</button></div></div>`}

 if(d.t==='up'){const u=PROD[d.name].upsell;b=`<div class="dlg up"><div class="hdr"><div><small>Se agrega al ${seatName(d.si).toLowerCase()}</small><h4>¿Lo hacemos mejor?</h4></div><button class="iconbtn" data-act="up-close" aria-label="Cerrar">${ic('close')}</button></div>
  <div class="cmp"><div class="up-card"><div><span class="chp">Tu elección</span></div><div class="imgp">${ic('img',24)}<span>${d.name}</span></div><div><h5>${d.name}</h5><div class="pr" style="margin-top:6px">${money(PROD[d.name].p)}</div></div><button class="pill out" style="margin-top:auto;justify-content:center;border-radius:20px;height:44px;border-color:var(--outline-var)" data-act="up-keep">Mantener</button></div>
  <div class="up-card best"><div style="display:flex;gap:8px"><span class="chp" style="gap:8px">${ic('star',18)}Más pedido</span><span class="chp">+ ${money(u.p-PROD[d.name].p)}</span></div><div class="imgp">${ic('img',24)}<span>${u.name}</span></div><div><h5>${u.name}</h5><p style="margin-top:8px">${u.desc}</p></div><div class="pr">${money(u.p)}<small>en vez de ${money(PROD[d.name].p)}</small></div><button class="pill filled big" style="height:56px;border-radius:28px;font-size:16px" data-act="up-change">Cambiar a ${u.name}</button></div></div></div>`}
 if(d.t==='prod'){
  const gs=PROD[d.name].groups,ok=gs.every(g=>d.sel[g.id]);
  const tg=v=>`<span class="tag ${v?'':'req'}">${v?'Completo':'Requerido'}</span>`;
  b=`<div class="dlg pm"><h4>${d.name}</h4><div class="sub">${S.order.name} · ${money(d.price)}</div>
  <div class="cols" style="grid-template-columns:repeat(${gs.length},1fr)">${gs.map(g=>`<div><div class="gl">${g.l}${tg(d.sel[g.id])}</div><div class="ocs">${g.o.map(v=>`<button class="oc ${d.sel[g.id]===v?'on':''}" data-act="pm-opt" data-g="${g.id}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')}</div>
  <div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center"><div class="gl" style="margin:0">Quitar o agregar</div><span style="font-size:12px;color:var(--on-var)">Opcional</span></div>
  <div class="ocs" style="margin-top:10px;gap:8px">${['Agregar','Quitar'].map(v=>`<button class="oc ${d.ingMode===v?'t':''}" data-act="pm-mode" data-v="${v}">${d.ingMode===v?ic('check',18):''}${v}</button>`).join('')}</div>
  <div class="field"><span class="fl">Ingrediente</span><input id="ing" placeholder="Ej. Cebolla" autocomplete="off" value="${(d.ing||'').replace(/"/g,'&quot;')}"></div>
  <div class="foot"><label class="cant">Cant.<input id="pq" inputmode="numeric" value="${d.qty}" autocomplete="off"></label><div style="display:flex;align-items:center;gap:8px"><button class="tb" data-act="pm-close" style="padding:10px 24px">Cerrar</button><button class="pill filled" style="height:56px;padding:0 32px;font-size:16px" data-act="pm-ok" ${ok?'':'disabled'}>${d.mode==='edit'?'Guardar cambios':'Agregar'}</button></div></div></div>`}
 return `<div class="scrim" data-act="scrim">${b}</div>`;
}
const snackHTML=()=>S.snack?`<div class="snack ${S.snack.err?'err':''}"><span>${S.snack.text}</span>${S.snack.label?`<button data-act="${S.snack.act}">${S.snack.label}</button>`:''}</div>`:'';

/* ================= render ================= */
function render(){
 const sc={home:homeHTML,code:codeHTML,success:okHTML,pick:pickHTML,map:mapHTML,order:orderHTML,three:threeHTML}[S.screen]();
 const hadDlg=!!stage.querySelector('.scrim'),hadSnack=!!stage.querySelector('.snack');
 stage.innerHTML=sc+dlgHTML()+snackHTML();
 if(hadDlg){const x=stage.querySelector('.scrim');if(x)x.classList.add('na')}
 if(hadSnack){const x=stage.querySelector('.snack');if(x)x.classList.add('na')}
 const q=document.getElementById('q'); if(q)q.addEventListener('input',()=>{const v=q.value.trim();document.querySelectorAll('#grid .tbl').forEach(b=>{b.style.display=(!v||b.dataset.id.includes(v))?'':'none'})});
 const mg=document.getElementById('mgr'); if(mg){mg.addEventListener('input',()=>{S.dlg.val=mg.value});setTimeout(()=>mg.focus(),0)}
 document.querySelectorAll('.qin').forEach(inp=>{
  inp.addEventListener('focus',()=>inp.select());
  inp.addEventListener('input',()=>{
   const g=inp.dataset.g,nme=inp.dataset.n,n=S.th.n;let v=parseInt(inp.value.replace(/\D/g,''),10)||0;
   const others=Object.entries(S.th.q[g]).filter(([k])=>k!==nme).reduce((a,[,x])=>a+x,0);
   v=Math.max(0,Math.min(v,n-others));S.th.q[g][nme]=v;inp.value=inp.value===''?'':String(v);updateQty();
  });
 });
 const ing=document.getElementById('ing');if(ing)ing.addEventListener('input',()=>{S.dlg.ing=ing.value});
 const pq=document.getElementById('pq');if(pq){pq.addEventListener('focus',()=>pq.select());pq.addEventListener('input',()=>{const v=parseInt(pq.value.replace(/\D/g,''),10);S.dlg.qty=v>0?Math.min(v,99):1;if(pq.value!=='')pq.value=String(S.dlg.qty)})}
 const nm=document.getElementById('nm'); if(nm){nm.addEventListener('input',()=>{S.dlg.name=nm.value});if(!S.dlg.touched){S.dlg.touched=true;setTimeout(()=>nm.focus(),0)}}
}

/* ================= lógica ================= */
function submit(){
 if(locked()||S.code.length<4)return;
 const emp=S.employees[S.code];
 if(!emp){
  S.fails++;S.code='';S.err='Código incorrecto. Inténtalo de nuevo.';
  if(S.fails>=3){S.snack=null;S.lockUntil=Date.now()+15000;S.err=null;render();startLock();return}
  snack('Ese código no existe. Inténtalo de nuevo.',{err:true});render();return;
 }
 if(emp.conn&&!emp.connDone){emp.connDone=true;snack('No pudimos registrar la marca. Revisa tu conexión.',{sticky:true,label:'Reintentar',act:'retry',err:true});render();return}
 S.snack=null;S.err=null;S.fails=0;S.emp=emp;S.empCode=S.code;S.pending=null;
 const m=S.mode;
 if(m==='entrada'||m==='pedidos'){
  if(emp.onBreak&&m==='entrada'){emp.onBreak=false;S.pending='back';return success()}
  if(emp.marked){ if(m==='pedidos')return toPick(); S.dlg={t:'already'};render();return }
  if(emp.early&&!emp.authorized){S.dlg={t:'early',val:'',err:null};render();return}
  emp.marked=NOW;
  if(m==='pedidos'){toPick(true);return}
  return success();
 }
 if(m==='descanso')emp.onBreak=true;
 if(m==='salida')emp.marked=null;
 success();
}
function startLock(){
 clearTimers();
 timers.push(setInterval(()=>{
  const left=Math.ceil((S.lockUntil-Date.now())/1000);
  if(left<=0){clearTimers();S.lockUntil=0;S.fails=0;S.err=null;render();return}
  const b=document.getElementById('lockbtn');if(b)b.textContent='Intenta de nuevo en 0:'+String(left).padStart(2,'0');
 },250));
}
function success(){
 S.screen='success';S.count=5;S.dlg=null;render();
 timers.push(setInterval(()=>{S.count--;const c=document.getElementById('cd');if(c)c.textContent=S.count;if(S.count<=0){go('home')}},1000));
}
function toPick(justMarked){
 clearTimers();S.pick=new Set();S.screen='pick';S.dlg=null;
 if(justMarked)snack('Entrada registrada · '+NOW);
 render();
}
function resetCode(m){S.mode=m;S.code='';S.err=null;S.fails=S.fails;S.screen='code';S.dlg=null;S.snack=null;clearTimers();if(locked())startLock();render()}

function enterMap(){
 S.screen='map';S.dlg=null;S.view='mine';S.mapMode='normal';S.panel='reservas';S.sel=null;render();
}
function startMapNow(){ // atajo de demostración
 fresh();S.emp=S.employees['1234'];S.empCode='1234';S.employees['1234'].marked=NOW;
 [31,41,42,43].forEach(id=>S.tables[id].owner='me');S.tables[41].pers=4;
 enterMap();snack('Turno iniciado · 4 mesas asignadas');render();
}

/* ================= eventos ================= */
stage.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 const a=el.dataset.act, d=el.dataset;
 if(a==='scrim'){ if(e.target!==el)return; if(S.dlg&&['crear','dar','unir','confirmPick'].includes(S.dlg.t)){return} return; }
 switch(a){
  case 'start':resetCode(d.m);break;
  case 'back':S.code='';S.err=null;go('home');break;
  case 'seg':S.mode=d.m;S.err=null;render();break;
  case 'key':if(S.code.length<4){S.code+=d.k;S.err=null;render()}break;
  case 'clear':S.code='';S.err=null;render();break;
  case 'del':S.code=S.code.slice(0,-1);S.err=null;render();break;
  case 'submit':case 'retry':if(a==='retry'){S.snack=null}submit();break;
  case 'forgot':snack('Avisamos a tu gerente. Se acercará a ayudarte.');render();break;
  case 'done':go('home');break;
  case 'orders':toPick();break;
  case 'dlg-home':S.code='';go('home');break;
  case 'dlg-orders':toPick();break;
  case 'dlg-early-back':S.dlg=null;S.code='';go('home');break;
  case 'dlg-early-ok':{
   if((S.dlg.val||'')!=='9999'){S.dlg.err='Código del gerente incorrecto.';render();break}
   S.emp.authorized=true;S.emp.marked=NOW;
   if(S.mode==='pedidos')toPick(true);else success();break}
  /* elegir mesas */
  case 'tbl':tblTap(+d.id);break;
  case 'pick-remove':S.pick.delete(+d.id);render();break;
  case 'pick-skip':enterMap();snack('Turno iniciado sin mesas asignadas');render();break;
  case 'pick-start':S.dlg={t:'confirmPick'};render();break;
  case 'confirm-review':S.dlg=null;render();break;
  case 'confirm-go':{
   const ids=[...S.pick];Object.keys(S.tables).forEach(id=>{if(S.tables[id].owner==='me')S.tables[id].owner=null});
   ids.forEach(id=>{S.tables[id].owner='me'});
   enterMap();
   snack(`Turno iniciado · ${ids.length} ${ids.length===1?'mesa asignada':'mesas asignadas'}`,{label:'Deshacer',act:'undo-turno',ms:6000});
   S.undo=()=>{ids.forEach(id=>S.tables[id].owner=null);S.pick=new Set(ids);S.screen='pick';S.snack=null};
   render();break}
  case 'undo-turno':if(S.undo){S.undo();S.undo=null}render();break;
  /* mapa */
  case 'seg-view':S.view=d.v;S.sel=null;render();break;
  case 'panel-close':S.panel='reservas';S.sel=null;render();break;
  case 'funciones':S.panel=S.panel==='opciones'?'reservas':'opciones';render();break;
  case 'virt-toggle':S.panel=S.panel==='virtuales'?'reservas':'virtuales';S.sel=null;render();break;
  case 'virt-open':openOrder(S.virtuals[+d.i].name,S.virtuals[+d.i].pers);break;
  case 'order-back':S.screen='map';S.snack=null;render();break;
  case 'opts':snack('Opciones de mesa: fuera del alcance de este prototipo.');render();break;
  case 'send':snack('Pedido enviado a cocina · Chk 2304');render();break;
  case 'pay':snack('Pago: fuera del alcance de este prototipo.');render();break;
  case 'seat':ord().cur=+d.i;render();break;
  case 'cat':ord().cat=d.c;render();break;
  case 'prod':{
   const n=d.n,p=PROD[n],o=ord();
   if(p.three){openThree();break}
   if(p.groups){S.dlg={t:'prod',mode:'add',name:n,price:p.p,sel:{},ing:'',ingMode:'Quitar',qty:1,si:o.cur};render();break}
   if(p.upsell){S.dlg={t:'up',name:n,si:o.cur};render();break}
   addItem(o,o.cur,{base:n,name:n,price:p.p,qty:1,mods:[]});render();break}
  case 'up-close':S.dlg=null;render();break;
  case 'up-keep':{const n=S.dlg.name,o=ord();addItem(o,S.dlg.si,{base:n,name:n,price:PROD[n].p,qty:1,mods:[]});S.dlg=null;render();break}
  case 'up-change':{const n=S.dlg.name,u=PROD[n].upsell,o=ord();addItem(o,S.dlg.si,{base:n,name:u.name,price:u.p,qty:1,mods:[]});S.dlg=null;snack(`Cambiaste a ${u.name}`);render();break}
  case 'line':{
   const o=ord(),it=o.seats[+d.i].items[+d.k];
   if(it&&it.custom){const c=it.custom;S.dlg={t:'prod',mode:'edit',name:it.base,price:it.price,sel:{...c.sel},ing:c.ing||'',ingMode:c.ingMode||'Quitar',qty:it.qty,si:+d.i,idx:+d.k};render()}
   break}
  case 'pm-opt':S.dlg.sel[d.g]=d.v;render();break;
  case 'pm-mode':S.dlg.ingMode=d.v;render();break;
  case 'pm-close':S.dlg=null;render();break;
  case 'pm-ok':{
   const x=S.dlg,o=ord(),gs=PROD[x.name].groups;if(!gs.every(g=>x.sel[g.id]))break;
   const ing=(x.ing||'').trim(),mods=gs.map(g=>x.sel[g.id]);if(ing)mods.push((x.ingMode==='Quitar'?'SIN ':'EXTRA ')+ing);
   const custom={sel:{...x.sel},ing:ing,ingMode:x.ingMode};
   if(x.mode==='edit'){const it=o.seats[x.si].items[x.idx];it.mods=mods;it.custom=custom;it.qty=x.qty;it.k=it.base+'|'+mods.join(',')}
   else addItem(o,x.si,{base:x.name,name:x.name,price:x.price,qty:x.qty,mods,custom});
   S.dlg=null;render();break}
  case 'th-back':S.screen='order';S.th=null;render();break;
  case 'th-mode':S.th.mode=d.v;render();break;
  case 'th-seat':S.th.sel=+d.i;render();break;
  case 'th-pick':{const sd=S.th.seats[S.th.sel-1];sd[d.g]=d.v;render();break}
  case 'th-save':{
   const th=S.th,o=ord();if(!thDone())break;
   addItem(o,0,{base:'3 for Me',name:'3 For Me',price:25.9,qty:th.n,total:thTotal(),mods:[],sub:'Entrada + plato + bebida',three:true});
   o.cur=0;S.screen='order';S.th=null;snack(`3 For Me × ${th.n} agregado a Compartido`);render();break}
  case 'crear-open':S.dlg={t:'crear',name:'',pers:0};render();break;
  case 'crear-cancel':S.dlg=null;render();break;
  case 'step':if(S.dlg){S.dlg.pers=Math.max(0,S.dlg.pers+(+d.d));render()}break;
  case 'crear-ok':{
   const nameVal=(S.dlg.name||'').trim()||('Mesa virtual '+(S.virtuals.length+1));
   const v={name:nameVal,pers:S.dlg.pers};S.virtuals.push(v);S.dlg=null;S.panel='reservas';
   snack(`${v.name} · ${cm(v.pers)}`,{label:'Tomar pedido',act:'snack-order',ms:7000});S.order=v;render();break}
  case 'snack-order':openOrder(S.order.name,S.order.pers);break;
  case 'dar-open':S.mapMode='dar';S.giveSel=new Set();S.view='mine';S.panel='reservas';S.sel=null;render();break;
  case 'dar-cancel':S.mapMode='normal';S.giveSel=new Set();render();break;
  case 'dar-remove':S.giveSel.delete(+d.id);render();break;
  case 'dar-all':{const m=mineIds();S.giveSel=S.giveSel.size===m.length?new Set():new Set(m);render();break}
  case 'dar-send':S.dlg={t:'dar',to:null};render();break;
  case 'dar-pick':S.dlg.to=d.n;render();break;
  case 'dar-back':S.dlg=null;render();break;
  case 'dar-ok':{
   const ids=[...S.giveSel].sort((a,b)=>a-b),to=S.dlg.to;const prev=ids.map(id=>({id,join:S.tables[id].join}));
   ids.forEach(id=>{S.tables[id].owner='other'});
   S.mapMode='normal';S.giveSel=new Set();S.dlg=null;
   snack(`${ids.length===1?'Mesa':'Mesas'} ${list(ids)} dada${ids.length>1?'s':''} a ${to}`,{label:'Deshacer',act:'undo-simple',ms:6500});
   S.undo=()=>{ids.forEach(id=>S.tables[id].owner='me');S.snack=null};
   render();break}
  case 'undo-simple':if(S.undo){S.undo();S.undo=null}render();break;
  case 'unir-open':S.mapMode='unir';S.joinSel=new Set();S.view='all';S.panel='reservas';S.sel=null;render();break;
  case 'unir-cancel':S.mapMode='normal';S.joinSel=new Set();render();break;
  case 'unir-remove':S.joinSel.delete(+d.id);render();break;
  case 'unir-go':S.dlg={t:'unir',pers:0};render();break;
  case 'unir-back':S.dlg=null;render();break;
  case 'unir-ok':{
   const ids=[...S.joinSel].sort((a,b)=>a-b),p=S.dlg.pers;const j='J'+(++S.joins);
   ids.forEach(id=>{const t=S.tables[id];t.owner='me';t.join=j;t.pers=p});
   S.mapMode='normal';S.joinSel=new Set();S.dlg=null;S.view='mine';
   snack(`Mesas ${list(ids)} unidas · ${cm(p)}`);render();break}
 }
});
function tblTap(id){
 if(S.screen==='pick'){S.pick.has(id)?S.pick.delete(id):S.pick.add(id);render();return}
 if(S.mapMode==='dar'){S.giveSel.has(id)?S.giveSel.delete(id):S.giveSel.add(id);render();return}
 if(S.mapMode==='unir'){S.joinSel.has(id)?S.joinSel.delete(id):S.joinSel.add(id);render();return}
 const t=S.tables[id];
 if(t.owner==='me'){
  let name='Mesa '+id,pers=t.pers||4;
  if(t.join){const g=IDS.filter(x=>S.tables[x].join===t.join);name='Mesas '+list(g);}
  openOrder(name,pers);return;
 }
 S.sel=S.sel===id?null:id;render();
}
document.addEventListener('keydown',e=>{
 if(S.screen!=='code'||S.dlg||locked())return;
 if(/^[0-9]$/.test(e.key)&&S.code.length<4){S.code+=e.key;S.err=null;render()}
 else if(e.key==='Backspace'){S.code=S.code.slice(0,-1);S.err=null;render()}
 else if(e.key==='Enter')submit();
});
/* ================= escala ================= */
function fit(){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
 const W=Math.max(962,Math.min(1100,Math.round(601*w/h)));
 const s=Math.max(.3,Math.min(w/W,h/601,3));
 document.documentElement.style.setProperty('--w',W);
 document.documentElement.style.setProperty('--s',s.toFixed(4));
}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
render();
</script>
